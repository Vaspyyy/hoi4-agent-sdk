[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-agent-sdk"
version = "0.6.5"
description = "Source-preserving Python SDK for Hearts of Iron IV modding"
readme = "README.md"
license = "MIT"
authors = [{ name = "Vaspyyy" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["hearts-of-iron-iv", "hoi4", "modding", "paradox-script"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Vaspyyy/hoi4-agent-sdk"
Issues = "https://github.com/Vaspyyy/hoi4-agent-sdk/issues"

[project.optional-dependencies]
assets = [
    "Pillow>=10.0,<14.0",
]
gemini = [
    "google-genai>=2.14,<4",
    "Pillow>=12.3,<14",
]
map = [
    "Pillow>=10.0,<14.0",
    "numpy>=1.26",
    "scipy>=1.11",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "build>=1.2",
    "twine>=6.0",
    "pip-audit>=2.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "corpus: opt-in checks against a real game install (needs HOI4_INSTALL_DIR)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF", "S"]
ignore = [
    # The asserts in the library narrow types for mypy (a span checked as a
    # block has its body offsets); none guards a value a caller passes.
    "S101",
    # Skipping a game or base-mod file that cannot be read is deliberate:
    # the file is reported elsewhere or is reference data only.
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# The security rules are for the library: tests, scripts and examples may
# assert, run subprocesses and write temporary files.
# The encoding and parser tests also feed look-alike characters (en dashes,
# Cyrillic letters, Unicode line separators) on purpose.
"tests/*" = ["S", "RUF001"]
"scripts/*" = ["S"]
"examples/*" = ["S"]
# The map generator rounds numpy numbers: round() of a numpy float can stay a
# numpy number, so the int() around it is needed.
"src/hoi4/mapgen/*" = ["RUF046"]

[tool.coverage.run]
branch = true
source = ["hoi4"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hoi4 = ["py.typed"]
