[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-agent-sdk"
version = "0.4.3"
description = "Source-preserving Python SDK for Hearts of Iron IV modding"
readme = "README.md"
license = "MIT"
authors = [{ name = "Vaspyyy" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["hearts-of-iron-iv", "hoi4", "modding", "paradox-script"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Vaspyyy/hoi4-agent-sdk"
Issues = "https://github.com/Vaspyyy/hoi4-agent-sdk/issues"

[project.optional-dependencies]
assets = [
    "Pillow>=10.0,<13.0",
]
gemini = [
    "google-genai>=2.14,<3",
    "Pillow>=12.3,<13",
]
map = [
    "Pillow>=10.0,<13.0",
    "numpy>=1.26",
    "scipy>=1.11",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "build>=1.2",
    "twine>=6.0",
    "pip-audit>=2.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["hoi4"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hoi4 = ["py.typed"]
