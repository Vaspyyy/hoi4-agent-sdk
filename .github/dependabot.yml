version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 3
    groups:
      python-tooling:
        patterns:
          - pytest
          - pytest-cov
          - hypothesis
          - ruff
          - mypy
          - build
          - twine
          - pip-audit
          - pip
          - setuptools
          - wheel
      optional-dependencies:
        patterns:
          - Pillow
          - google-genai
          - numpy
          - scipy

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "10:15"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
