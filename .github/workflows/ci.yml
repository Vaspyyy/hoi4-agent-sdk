name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - run: python -m pip install pip -c requirements/ci.txt
      - run: python -m pip install -e '.[dev]' -c requirements/ci.txt
      - run: python -m ruff check src/ examples/ scripts/ tests/
      - run: python -m mypy --no-site-packages src/
      - run: python -m pip_audit --local --skip-editable
      - run: git diff --check
      - name: Validate package/runtime/changelog identity
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/release_tools.py check --tag "v${version}"

  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - run: python -m pip install -e . pytest hypothesis -c requirements/ci.txt
      - env:
          HOI4_HYPOTHESIS_PROFILE: ci
        run: python -m pytest tests/

  minimum-optional:
    name: Minimum optional dependencies (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: >-
          python -m pip install -e . pytest hypothesis
          Pillow==10.0.0 numpy==1.26.0 scipy==1.11.0
          -c requirements/ci.txt
      - env:
          HOI4_HYPOTHESIS_PROFILE: ci
        run: python -m pytest tests/

  gemini-optional:
    name: Gemini optional dependency (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - run: python -m pip install -e '.[gemini]' pytest hypothesis -c requirements/ci.txt
      - env:
          HOI4_HYPOTHESIS_PROFILE: ci
        run: python -m pytest tests/test_gemini_images.py tests/test_assets.py

  coverage-latest:
    name: Coverage and latest optional dependencies (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: >-
          python -m pip install -e . pytest pytest-cov hypothesis
          -r requirements/optional-latest.txt
          -c requirements/ci.txt
      - env:
          HOI4_HYPOTHESIS_PROFILE: ci
        run: >-
          python -m pytest tests/
          --cov=hoi4 --cov-branch --cov-report=term-missing
          --cov-fail-under=80

  package:
    name: Build and install smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install build twine -c requirements/ci.txt
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/hoi4-wheel-smoke"
          "$RUNNER_TEMP/hoi4-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hoi4-wheel-smoke/bin/python" -c "from importlib.metadata import version; import hoi4; assert hoi4.__version__ == version('hoi4-agent-sdk')"
      - name: Smoke-test sdist
        run: |
          python -m venv "$RUNNER_TEMP/hoi4-sdist-smoke"
          "$RUNNER_TEMP/hoi4-sdist-smoke/bin/python" -m pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hoi4-sdist-smoke/bin/python" -c "from importlib.metadata import version; import hoi4; assert hoi4.__version__ == version('hoi4-agent-sdk')"
      - run: PYTHONPATH=src python scripts/release_tools.py checksums --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
