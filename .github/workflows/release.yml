name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: vMAJOR.MINOR.PATCH identity to dry-run against the selected ref
        required: true
        type: string

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.ref }}

  release:
    name: Validate and publish
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Validate release identity and artifacts
        env:
          PYTHONPATH: src
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python scripts/release_tools.py check --tag "$RELEASE_TAG"
          python scripts/release_tools.py notes --tag "$RELEASE_TAG" --output release-notes.md
          cd dist
          sha256sum -c SHA256SUMS
      - name: Refuse to overwrite an existing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 1
          fi
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
      - name: Dry-run result
        if: github.event_name == 'workflow_dispatch'
        run: echo "Dry run passed; no GitHub release was created."
